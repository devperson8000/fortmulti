name: Game checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Install Chromium for two-player browser check
        run: npx playwright install --with-deps chromium
      - name: Start multiplayer preview
        run: |
          PORT=4174 npm run dev > /tmp/horizon-preview.log 2>&1 &
          for attempt in $(seq 1 35); do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/horizon-preview.log
          exit 1
      - name: Verify boarding, launch, beat landing, salute and gameplay
        run: npm run test:deployment-browser
        env:
          GAME_TEST_URL: http://127.0.0.1:4174
          GAME_ARTIFACTS: /tmp/horizon-deployment
      - name: Verify original song continuity and native audio fades
        run: npm run test:deployment-audio
        env:
          GAME_TEST_URL: http://127.0.0.1:4174
          GAME_ARTIFACTS: /tmp/horizon-deployment
      - name: Verify controls, inventory, reloads, chests and real building inputs
        run: npm run test:browser
        env:
          GAME_TEST_URL: http://127.0.0.1:4174
          GAME_ARTIFACTS: /tmp/horizon-deployment/gameplay
      - name: Verify gunshot voices, opponent sounds and reload audio
        run: |
          node scripts/ar-audio-check.mjs
          node scripts/shotgun-audio-check.mjs
        env:
          GAME_TEST_URL: http://127.0.0.1:4174
          GAME_ARTIFACTS: /tmp/horizon-deployment/weapons
      - name: Verify Platform 23 native map integration
        run: npm run test:platform23-browser
        env:
          GAME_TEST_URL: http://127.0.0.1:4174
          GAME_TEST_GRAPHICS: low
          GAME_ARTIFACTS: /tmp/horizon-deployment/platform23
      - name: Upload browser diagnostics if a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-deployment-diagnostics
          path: /tmp/horizon-deployment
          if-no-files-found: ignore
